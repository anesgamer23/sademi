<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SADMI</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: url(usine.jpg);
           
            text-align: center;
            
        
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }
        .card {
            background: linear-gradient(135deg, #007BFF, #00C3FF);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
            transform: scale(0.8);
            opacity: 0;
        }
        .card img {
            width: 50px;
            margin-bottom: 10px;
        }
        .card h3 {
            margin: 10px 0;
        }
        .card a {
            color: rgb(203, 230, 119);
            text-decoration: none;
            font-weight: bold;
        }
        .card:hover {
            transform: scale(1);
            transition: 0.3s;
        }
    
        .footer {
    background-color: #222;
    color: #fff;
    padding: 40px 20px;
    margin-top: 40px;
    font-size: 14px;
    text-align: center;
}

.footer-container {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
    gap: 20px;
}

.footer-section {
    flex: 1;
    min-width: 200px;
}

.footer-section h4 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #ff9100;
}

.footer-section p,
.footer-section ul {
    margin: 0;
    line-height: 1.5;
}

.footer-section ul {
    list-style: none;
    padding: 0;
}

.footer-section ul li {
    margin-bottom: 8px;
}

.footer-section ul li a {
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
}

.footer-section ul li a:hover {
    color: #ff9100;
}

.social { 
    width: 30px; height: 30px;
    margin-right: 10px;
}


.footer-bottom {
    border-top: 1px solid #444;
    padding-top: 20px;
    margin-top: 20px;
    font-size: 12px;
}
.socials{
   border: none;
   box-shadow: none;
   width: 30px; height: 30px;
    margin-right: 10px;

}
    
   
   
.bottom-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2196f3;
            color: #ffffff;
            border: none;
            border-radius:50% ;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        .bottom-button:hover {
            background-color: #1976d2;
            transform: scale(1.1);
        }
   
   
   
   </style>
</head>
<body>
    <div class="container">
        <div class="card" id="email">
            <img src="pos.jpg" alt="position">
            <h3>localisation</h3>
            <a href="">position</a>
        </div>
        <div class="card" id="facebook">
            <img src="face.jpg" alt="Facebook">
            <h3>Facebook</h3>
            <a href="https://facebook.com/sadmi">facebook</a>
        </div>
        <div class="card" id="linkedin">
            <img src="linked.jpg" alt="LinkedIn">
            <h3>LinkedIn</h3>
            <a href="https://linkedin.com/company/sadmi">linkedin</a>
        </div>
    </div>

  
    
    
    
    
    
    <script>
        gsap.registerPlugin(ScrollTrigger);
        gsap.fromTo(".card", {opacity: 0, scale: 0.8}, {
            opacity: 1,
            scale: 1,
            duration: 1,
            stagger: 0.3,
            ease: "elastic.out(1, 0.5)",
            scrollTrigger: {
                trigger: ".container",
                start: "top 80%",
            }
        });
    </script>

<button class="bottom-button" onclick="changerpage()">🔙</button>
<script>
function changerpage()
{   
  window.location.href="index.html" 
} 
</script>




<footer class="footer">
    <div class="footer-container">
        <div class="footer-section">
            <h4>About Us</h4>
            <p> ✅ Automatisation industrielle </p>
             <p> ✅ Électricité industrielle</p>
              <p> ✅ Montage d'équipements</p>
            </div>
        
        <div class="footer-section">
            <h4>Follow Us</h4>
            <div class="social-icons">
                <a href="#facebook"><img class="social" src="face.jpg"></a>
                <a href="#linked in"><img class="socials" src="lind.jpg"></a>
               
            </div>
        </div>
    </div>
    <div class="footer-bottom">
         
        
        <p>&copy; <strong>SADMI</strong>. All rights reserved.</p>
    </div>
</footer>


</body>
</html>
